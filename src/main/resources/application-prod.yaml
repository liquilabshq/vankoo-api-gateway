spring:
  cloud:
    gateway:
      server:
        webflux:
          globalcors:
            cors-configurations:
              '[/**]':
                # Permitir orígenes, métodos y encabezados configurables a través de variables de entorno
                # con valores predeterminados que permiten todas las solicitudes
                allowedOrigins: ${ALLOWED_ORIGINS:*}
                allowedMethods: ${ALLOWED_METHODS:GET,POST,PUT,DELETE,OPTIONS}
                allowedHeaders: ${ALLOWED_HEADERS:*}