spring:
  application:
    name: api-gateway
  profiles:
    active: ${SPRING_PROFILES_ACTIVE}
  cloud:
    gateway:
      server:
        webflux:
          # El iam-service también tiene su propia configuración CORS, así que la
          # respuesta salía del gateway con Access-Control-Allow-Origin dos veces y el
          # navegador la rechazaba: "contains multiple values '*, *'". RETAIN_UNIQUE
          # deja una sola. Va aquí, en el perfil base, porque el problema no depende
          # del entorno.
          default-filters:
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE
          # Descubrimiento automático de servicios
          discovery:
            locator:
              enabled: false # Desactivamos la detección automática de servicios para definir rutas explícitas
              lower-case-service-id: true # Convierte los IDs de servicio a minúsculas para las rutas
          # Definición de Rutas Explícitas
          routes:
            # RUTA PARA EL IAM SERVICE
              # Nombre interno de la ruta, no tiene que coincidir con nada específico, es solo para identificación interna
              # 1. Registro y Login (Público - Específico)
            - id: iam-auth-public
              # En lugar de poner una IP fija, le pregunta a Eureka quién es `iam-service` y le envía la petición.
              # Si tienes 3 instancias de `iam-service` corriendo, Eureka balanceará la carga entre ellas.
              # El nombre "iam-service" DEBE ser exactamente el `spring.application.name` que se puso en el IAM.
              uri: lb://iam-service # 'lb://' activa el Load Balancer (balanceador de carga) de Eureka
              predicates:
                - Path=/iam/api/v1/authentication/** # Captura lo que venga como http://localhost:8080/iam/api/v1/authentication/** y lo enruta al IAM Service
              filters:
                - StripPrefix=1 # Elimina '/iam' de la URL antes de enviarla al microservicio

              # 2. Usuarios y perfiles (Protegido - Específico)
            - id: iam-users-protected
              uri: lb://iam-service
              predicates:
                - Path=/iam/api/v1/users/**
              filters:
                - StripPrefix=1
                # El nombre real del filtro es 'BearerAuthorizationRequestGatewayFilterFactory', pero en el YAML
                # se puede usar la parte antes de 'GatewayFilterFactory' gracias a la convención de Spring Cloud Gateway
                - BearerAuthorizationRequest # <--- Aplicamos nuestro filtro custom

              # 3. Documentación y Actuator (Público - Específico)
              # Esto permite que Scalar funcione sin abrir el microservicio entero
            - id: iam-docs-route
              uri: lb://iam-service
              predicates:
                - Path=/iam/v3/api-docs/**, /iam/actuator/**, /iam/swagger-ui/**
              filters:
                - StripPrefix=1

            # 3. Vankoo Investment Service (Protegido , Publico)
            #
            - id: investment-participant-queries-protected
              uri: lb://investment-service
              predicates:
                  - Path=/investment/api/v1/auctions/mype/**, /investment/api/v1/auctions/investor/**
              filters:
                - StripPrefix=1
                - BearerAuthorizationRequest

            - id : investment-auctions-public
              uri: lb://investment-service
              predicates:
                - Path=/investment/api/v1/auctions/**
              filters:
                - StripPrefix=1

            # RUTAS PARA EL FINANCE SERVICE
              # 4. Billetera y depósitos del inversionista (Protegido - Específico)
              # Mismo molde que iam-users-protected: el gateway valida el JWT, responde
              # 401 problem+json e inyecta X-User-Id/X-User-Email/X-User-Roles.
              # Finance todavía no lee X-User-Id (toma accountId del path); eso es una
              # tarjeta aparte de Finance, no se resuelve aquí.
              # El webhook de Stripe (/finance/api/v1/payment-providers/**) queda fuera
              # a propósito: Stripe no manda JWT, detrás de este filtro fallaría
              # siempre. En local sigue entrando directo por el 8083.
            - id: finance-investor-protected
              uri: lb://finance-service
              predicates:
                - Path=/finance/api/v1/deposits/**, /finance/api/v1/accounts/**
              filters:
                - StripPrefix=1
                - BearerAuthorizationRequest

              # 5. Documentación y Actuator (Público - Específico)
              # Igual que iam-docs-route. El gateway-url del OpenAPI de Finance ya
              # apunta a :8080/finance.
            - id: finance-docs-route
              uri: lb://finance-service
              predicates:
                - Path=/finance/v3/api-docs/**, /finance/actuator/**, /finance/swagger-ui/**
              filters:
                - StripPrefix=1

            # RUTA PARA EL INVOICING SERVICE
              # Protegida igual que iam-users-protected: el gateway valida el JWT y
              # agrega X-User-Id/X-User-Email/X-User-Roles antes de reenviar. El
              # controller de invoicing-service usa X-User-Id como MypeId.
            - id: invoicing-service
              uri: lb://invoicing-service
              predicates:
                - Path=/invoicing/api/v1/invoices/**
              filters:
                - StripPrefix=1
                - BearerAuthorizationRequest

              # 5. Documentación (Público - Específico)
              # Igual que iam-docs-route: permite que el agregador de Scalar del propio
              # gateway (ver `scalar.sources` más abajo) lea el OpenAPI de
              # invoicing-service sin abrir el microservicio entero. invoicing-service
              # es .NET (Scalar.AspNetCore), no Spring, así que sus rutas de docs son
              # /openapi/** y /scalar/** — no /v3/api-docs ni /swagger-ui como IAM.
            - id: invoicing-docs-route
              uri: lb://invoicing-service
              predicates:
                - Path=/invoicing/openapi/**, /invoicing/scalar/**
              filters:
                - StripPrefix=1

            # RUTAS PARA OTROS SERVICIOS (Ejemplo)
            # - id: catalog-service
            #   uri: lb://catalog-service
            #   predicates:
            #     - Path=/catalog/**
            #   filters:
            #     - StripPrefix=1
            #     - JwtAuthenticationFilter

authorization:
  jwt:
    secret: ${JWT_SECRET}

scalar:
  enabled: true
  path: /scalar
  sources:
    - url: /iam/v3/api-docs
      title: IAM Service
    - url: /finance/v3/api-docs
      title: Finance Service
    # invoicing-service es .NET (Scalar.AspNetCore): su documento OpenAPI vive en
    # /openapi/v1.json, no en /v3/api-docs como los servicios Spring.
    - url: /invoicing/openapi/v1.json
      title: Invoicing Service
  actuator-enabled: true
  theme: deep_space
